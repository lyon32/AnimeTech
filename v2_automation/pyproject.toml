[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2-automation"
version = "2.0.0"
description = "V2 Telegram automation — queued, durable, crash-recoverable pipeline on Local Bot API."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]