<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14171c">
<title>Panneau admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2333d6a0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='3'/%3E%3Cpath d='M10 9l5 3-5 3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<div class="app">
  <nav class="side" id="nav" aria-label="Navigation principale"></nav>
  <div class="col">
    <header class="top">
      <h1 id="title">Vue d’ensemble</h1>
      <div class="top-actions">
        <a class="status" id="status" href="#/sante" data-tone="muted" aria-live="polite"><span class="dot"></span><span id="status-text">Chargement…</span></a>
        <button class="btn" id="pause" type="button" hidden></button>
        <button class="btn" id="worker" type="button" hidden></button>
        <span class="stamp" id="stamp" aria-live="off"></span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/ui/app.js"></script>
</body>
</html>
